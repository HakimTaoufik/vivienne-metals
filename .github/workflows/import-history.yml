name: Import original version history
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vivienne-history-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify and import the tested dealer recovery
        shell: bash
        run: |
          set -euo pipefail
          echo 'a47bfbed47a1c84fde33193cf3d915f88799f8b8624b7de215ca5fa8da2e40fe  vivienne-recovery-v0.7.bundle' | sha256sum -c -
          git bundle verify vivienne-recovery-v0.7.bundle
          git fetch ./vivienne-recovery-v0.7.bundle refs/heads/main:refs/remotes/archive/main 'refs/tags/*:refs/tags/*'
          archive=$(git rev-parse refs/remotes/archive/main)
          test "$archive" = 'e6b7d16f0b9fef02472fd62dc2349e3f93090961'
          if git merge-base --is-ancestor "$archive" HEAD; then
            echo 'Recovery history is already imported.'
            exit 0
          fi
          git archive "$archive" | tar -x
          git restore --source=HEAD -- .github/workflows
          git add .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          tree=$(git write-tree)
          merged=$(git commit-tree "$tree" -p HEAD -p "$archive" -m 'chore: import tested dealer recovery and its small commits')
          git update-ref refs/heads/main "$merged" HEAD
          git push origin main
